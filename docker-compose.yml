services:
  lobby-server:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install && pnpm p2p:dev"
    environment:
      NODE_ENV: development
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost:${WEB_PORT:-4200}
      CHOKIDAR_USEPOLLING: 'true'
    ports:
      - '${P2P_PORT:-3002}:3002'
    volumes:
      - .:/app
      - p2p_node_modules:/app/node_modules
    depends_on:
      - redis

  web:
    image: node:22-alpine
    working_dir: /app
    command:
      - sh
      - -c
      - corepack enable && pnpm install && pnpm web:dev
    environment:
      NODE_ENV: development
      VITE_P2P_BASE: http://localhost:${P2P_PORT:-3002}
      CHOKIDAR_USEPOLLING: 'true'
    ports:
      - '${WEB_PORT:-4200}:4200'
    depends_on:
      - lobby-server
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules

  redis:
    image: redis:7-alpine
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    command: ['redis-server', '--save', '60', '1', '--loglevel', 'warning']

volumes:
  p2p_node_modules:
  web_node_modules:
  redis_data:
